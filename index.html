<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A 12-week structured French course from zero to A2, built around tech and business vocabulary.">
  <meta name="theme-color" content="#1E3A5F">
  <title>Mon Français — A2 by December</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇫🇷</text></svg>">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="#dashboard" class="brand">
        <span class="brand-mark">MF</span>
        <span>Mon Français</span>
      </a>
      <nav class="nav">
        <a href="#dashboard"  class="nav-link" data-v="dashboard"><span class="nav-ico">◎</span><span class="nav-txt">Parcours</span></a>
        <a href="#vocabulary" class="nav-link" data-v="vocabulary"><span class="nav-ico">▤</span><span class="nav-txt">Vocabulaire</span></a>
        <a href="#grammar"    class="nav-link" data-v="grammar"><span class="nav-ico">§</span><span class="nav-txt">Grammaire</span></a>
        <a href="#profile"    class="nav-link" data-v="profile"><span class="nav-ico">◐</span><span class="nav-txt">Profil</span></a>
      </nav>
      <button class="sync-chip" id="sync-chip" data-state="local" title="Sync status">
        <span class="sync-dot"></span><span class="sync-txt">This device only</span>
      </button>
    </div>
  </header>

  <main id="root"></main>

  <div class="toasts" id="toasts"></div>

  <script src="js/storage.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/data.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/flashcard.js"></script>
  <script src="js/exercise.js"></script>
  <script src="js/reading.js"></script>
  <script src="js/writing.js"></script>
  <script src="js/listening.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
